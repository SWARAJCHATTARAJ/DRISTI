[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dristi"
version = "0.4.1"
description = "An open-source probabilistic decision engine."
authors = [
    {name = "Dristi Contributors"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "transformers",
    "scikit-learn",
    "fastapi",
    "uvicorn",
    "pydantic"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx"
]
